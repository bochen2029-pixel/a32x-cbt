<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A32X CBT — B1</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0b0f14;
        color: #cfd8e3;
        font: 13px ui-monospace, Consolas, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #6aa9ff;
        margin: 0;
      }
      .row {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: center;
      }
      canvas {
        border: 1px solid #253040;
        border-radius: 4px;
        cursor: pointer;
      }
      #ecam {
        margin: 0;
        min-width: 300px;
        min-height: 340px;
        background: #05080c;
        border: 1px solid #253040;
        border-radius: 4px;
        padding: 10px;
        line-height: 1.45;
        white-space: pre;
        font-size: 12px;
      }
      #steps {
        min-width: 300px;
        min-height: 340px;
        background: #0e141b;
        border: 1px solid #253040;
        border-radius: 4px;
        padding: 10px;
        line-height: 1.6;
        font-size: 12px;
      }
      #steps .title {
        color: #d17bff;
        margin-bottom: 6px;
      }
      .verdict {
        color: #9fb0c3;
        margin-bottom: 8px;
      }
      .verdict.pass {
        color: #4ade80;
      }
      .verdict.fail {
        color: #ff3b30;
      }
      button {
        background: #121a24;
        color: #9fb0c3;
        border: 1px solid #253040;
        border-radius: 3px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button.on {
        color: #7ef0b0;
        border-color: #4ade80;
      }
      #drills {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #status {
        color: #55677d;
        font-size: 11px;
      }
      select {
        background: #121a24;
        color: #9fb0c3;
        border: 1px solid #253040;
        border-radius: 3px;
        padding: 4px 8px;
        font: inherit;
      }
      button.frozen {
        color: #ffb020;
        border-color: #ffb020;
      }
    </style>
  </head>
  <body>
    <h1>A32X CBT — B1</h1>
    <div id="drills"></div>
    <div class="row">
      <canvas id="panel"></canvas>
      <pre id="ecam"></pre>
      <div id="steps"></div>
    </div>
    <div class="row">
      <div id="pages"></div>
      <button id="restart">restart</button>
      <button id="freeze">freeze</button>
      <select id="fault"></select>
    </div>
    <div id="status"></div>
    <script src="app.js"></script>
  </body>
</html>
