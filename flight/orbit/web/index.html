<title>Runway to Ring</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A spaceplane flown from KDFW 17C to a spinning ring station in a 500 km orbit, over a round Earth. A sketch.">
<style>
  /* layout: the view fills the screen; the readouts, markers and controls float over it, clear of the
     phone's safe areas. One look, dark: this is the inside of a cockpit at night. Every panel is dark
     glass with a hairline edge and its text shadowed, so it reads over a bright sky as over space.
     On a desktop the buttons stand in three groups at the top right (flight, view and time, the page);
     on a touch screen the six used most sit between the stick and the throttle, under the thumbs, and
     MORE opens the rest. */
  :root {
    --void: #04060a;
    --glass: rgba(5, 8, 13, 0.74);
    --glass-strong: rgba(5, 8, 13, 0.88);
    --line: rgba(170, 200, 230, 0.26);
    --ink: #eef3f8;
    --dim: #a3b1c0;
    --vector: #7cc7ff;   /* where the craft is going */
    --target: #ffb35c;   /* the Ring */
    --alarm: #ff6b5e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.55);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --edge-t: calc(10px + env(safe-area-inset-top, 0px));
    --edge-b: calc(12px + env(safe-area-inset-bottom, 0px));
    --edge-l: calc(12px + env(safe-area-inset-left, 0px));
    --edge-r: calc(12px + env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--ink); }
  body { font: 13px/1.4 var(--sans); -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--void); }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #top { position: absolute; top: var(--edge-t); left: var(--edge-l); max-width: calc(100vw - 24px); display: grid; gap: 2px;
    padding: 6px 10px; border-radius: 6px; background: var(--glass); border: 1px solid var(--line); }
  #statusline { font: 600 14px/1.3 var(--mono); letter-spacing: 0.06em; text-shadow: var(--shadow); }
  #hint { color: var(--dim); font-size: 12px; text-shadow: var(--shadow); min-height: 1.2em; }
  #hint:empty { display: none; }
  #readouts {
    position: absolute; left: var(--edge-l); bottom: var(--edge-b); margin: 0; padding: 9px 11px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
    font: 12px/1.5 var(--mono); white-space: pre; font-variant-numeric: tabular-nums; text-shadow: var(--shadow);
    max-width: calc(100vw - 24px); overflow: hidden; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #say {
    position: absolute; top: 34%; left: 50%; transform: translateX(-50%); padding: 7px 13px; border-radius: 5px;
    font: 600 13px/1.3 var(--sans); letter-spacing: 0.04em; background: var(--glass-strong); border: 1px solid var(--line);
    color: var(--ink); text-shadow: var(--shadow); max-width: calc(100vw - 40px); text-align: center;
  }
  #say:empty { display: none; }
  #status { position: fixed; top: var(--edge-t); left: 50%; transform: translateX(-50%); max-width: 90vw; padding: 6px 12px;
    border-radius: 4px; font: 13px/1.4 var(--sans); background: var(--glass-strong); color: var(--dim); z-index: 5; }
  #status:empty { display: none; }
  #status.failed { background: var(--alarm); color: var(--void); font-weight: 600; }
  .mark { position: absolute; left: 0; top: 0; display: none; will-change: transform; }
  #fpm i { position: absolute; left: -8px; top: -8px; width: 12px; height: 12px; border: 2px solid var(--vector); border-radius: 50%; }
  #fpm i::before, #fpm i::after { content: ""; position: absolute; top: 5px; width: 9px; height: 2px; background: var(--vector); }
  #fpm i::before { left: -11px; }
  #fpm i::after { right: -11px; }
  #fpm i, #target i { box-shadow: 0 0 3px rgba(0, 0, 0, 0.8); }
  #target i { position: absolute; left: -10px; top: -10px; width: 16px; height: 16px; border: 2px solid var(--target); transform: rotate(45deg); }
  #target span { position: absolute; left: 14px; top: -7px; font: 600 11px/1 var(--mono); color: var(--target); white-space: nowrap; text-shadow: var(--shadow); }
  #help {
    position: absolute; right: var(--edge-r); bottom: var(--edge-b); display: none; gap: 3px 12px; grid-template-columns: auto auto;
    padding: 10px 12px; background: var(--glass-strong); border: 1px solid var(--line); border-radius: 6px; font-size: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-height: calc(100vh - 140px); overflow: auto; pointer-events: auto;
  }
  #help.shown { display: grid; }
  #help div { display: contents; }
  #help b { font: 600 11px/1.6 var(--mono); color: var(--vector); white-space: nowrap; }
  #help span { color: var(--ink); }
  /* the buttons: three groups, each two across */
  #buttons { position: absolute; top: calc(var(--edge-t) + 50px); right: var(--edge-r); width: 184px; display: grid; gap: 10px; pointer-events: auto; }
  #buttons .group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  #btn-view, #btn-quality { grid-column: span 2; }
  #buttons button {
    font: 600 11px/1 var(--sans); letter-spacing: 0.06em; color: var(--ink); background: var(--glass); border: 1px solid var(--line);
    border-radius: 5px; padding: 9px 10px; min-width: 70px; cursor: pointer; text-shadow: var(--shadow);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #buttons button:hover { border-color: rgba(124, 199, 255, 0.55); }
  #buttons button:focus-visible { outline: 2px solid var(--vector); outline-offset: 2px; }
  #buttons button:active { border-color: var(--vector); background: rgba(124, 199, 255, 0.18); }
  #btn-more { display: none; }
  #buttons button small { font: inherit; color: var(--dim); }
  #touch { display: none; }
  #stick { position: absolute; left: var(--edge-l); bottom: var(--edge-b); width: 128px; height: 128px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--glass); pointer-events: auto; touch-action: none; }
  #knob { position: absolute; left: 44px; top: 44px; width: 40px; height: 40px; border-radius: 50%; background: rgba(124, 199, 255, 0.35);
    border: 2px solid var(--vector); }
  #throttle { position: absolute; right: var(--edge-r); bottom: var(--edge-b); width: 46px; height: 150px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--glass); pointer-events: auto; touch-action: none; overflow: hidden; }
  #throttle-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(124, 199, 255, 0.35); border-top: 2px solid var(--vector); }
  #throttle::after { content: "THR"; position: absolute; top: 6px; width: 100%; text-align: center; font: 600 10px/1 var(--sans); color: var(--dim); letter-spacing: 0.08em; }
  @media (pointer: coarse) {
    #touch { display: block; }
    #top { right: var(--edge-r); max-width: none; }
    #readouts { bottom: auto; top: calc(var(--edge-t) + 58px); font-size: 10.5px; line-height: 1.45; padding: 7px 9px; }
    #help { bottom: auto; top: calc(var(--edge-t) + 58px); left: var(--edge-l); right: var(--edge-r); z-index: 3; max-height: calc(100vh - 300px); }
    /* six under the thumbs, between the stick and the throttle; the rest behind MORE */
    #buttons { top: auto; bottom: var(--edge-b); left: calc(var(--edge-l) + 138px); right: calc(var(--edge-r) + 56px); width: auto;
      grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; align-content: end; }
    #buttons .group { display: contents; }
    #btn-view, #btn-quality { grid-column: auto; }
    #buttons button { min-width: 0; padding: 11px 4px; font-size: 11px; background: var(--glass-strong); }
    #buttons button:not(.quick) { display: none; }
    #btn-more { display: block; }
    #buttons button small { display: none; }
    #buttons.open { left: var(--edge-l); right: var(--edge-r); bottom: calc(var(--edge-b) + 160px); padding: 10px; border-radius: 8px;
      background: var(--glass-strong); border: 1px solid var(--line); grid-template-columns: repeat(3, minmax(0, 1fr)); z-index: 4; }
    #buttons.open button { display: block; }
  }
  @media (pointer: coarse) and (orientation: landscape) {
    #readouts { font-size: 10px; line-height: 1.35; }
    #buttons { left: calc(var(--edge-l) + 140px); right: calc(var(--edge-r) + 58px); max-width: 360px; margin: 0 auto;
      grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #buttons.open { bottom: var(--edge-b); top: calc(var(--edge-t) + 58px); align-content: start; max-width: none; }
  }
  @media (max-width: 520px) {
    #statusline { font-size: 12px; }
    #hint { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { .mark { transition: none; } }
</style>
<!--BODY-->
<canvas id="view" aria-label="The view from the spaceplane"></canvas>
<div id="hud">
  <div id="top"><div id="statusline">Loading…</div><div id="hint"></div></div>
  <pre id="readouts"></pre>
  <div id="fpm" class="mark"><i></i></div>
  <div id="target" class="mark"><i></i><span id="target-label"></span></div>
  <div id="say"></div>
  <div id="help" role="dialog" aria-label="Controls"></div>
  <div id="buttons">
    <div class="group" role="group" aria-label="The flight">
      <button type="button" id="btn-crew" class="quick" data-cmd="crew">CREW</button>
      <button type="button" id="btn-orbit" class="quick" data-cmd="orbit">TO ORBIT</button>
      <button type="button" id="btn-approach" class="quick" data-cmd="approach">APPROACH</button>
      <button type="button" id="btn-dock" data-cmd="dock">DOCK</button>
      <button type="button" id="btn-walk" data-cmd="walk">WALK</button>
      <button type="button" id="btn-return" data-cmd="return">RETURN</button>
    </div>
    <div class="group" role="group" aria-label="View and time">
      <button type="button" id="btn-view" class="quick" data-cmd="view">VIEW</button>
      <button type="button" id="btn-slower" data-cmd="slower">TIME −</button>
      <button type="button" id="btn-faster" class="quick" data-cmd="faster">TIME +</button>
      <button type="button" id="btn-sas" data-cmd="sas-next">HOLD</button>
      <button type="button" id="btn-gear" data-cmd="gear">GEAR</button>
    </div>
    <div class="group" role="group" aria-label="The page">
      <button type="button" id="btn-quality" data-cmd="quality">GFX</button>
      <button type="button" id="btn-help" data-cmd="help">HELP</button>
      <button type="button" id="btn-reset" data-cmd="reset">RESTART</button>
      <button type="button" id="btn-more" class="quick" data-cmd="more" aria-expanded="false" aria-controls="buttons">MORE</button>
    </div>
  </div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="throttle"><div id="throttle-fill"></div></div>
  </div>
</div>
<div id="status">Loading the flight core…</div>
<!--SCRIPTS-->
