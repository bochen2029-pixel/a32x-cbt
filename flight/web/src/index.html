<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A32X — flight</title>
<style>
  :root { color-scheme: dark; --fg: #d8f0d8; --dim: #7a9a7a; --warn: #ffb000; --bad: #ff5a4a; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font: 14px/1.35 ui-monospace, "Cascadia Mono", Consolas, monospace; overflow: hidden; }
  #view, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { pointer-events: none; }
  #hud { position: fixed; left: 12px; bottom: 12px; white-space: pre; pointer-events: none;
    text-shadow: 0 0 3px #000, 0 0 2px #000; }
  #status { position: fixed; right: 12px; top: 12px; text-align: right; white-space: pre;
    color: var(--dim); pointer-events: none; text-shadow: 0 0 3px #000; }
  #status .bad { color: var(--bad); }
  #status .warn { color: var(--warn); }
  #debrief { position: fixed; left: 12px; top: 12px; white-space: pre; padding: 8px 10px;
    background: rgba(0,0,0,0.62); border: 1px solid rgba(160,200,160,0.3); border-radius: 4px; }
  #debrief { font-size: 12px; max-height: calc(100% - 170px); overflow: auto; }
  #events { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(160,200,160,0.25);
    max-height: 30vh; overflow: auto; }
  #debrief button { font: inherit; color: var(--fg); background: rgba(40,60,45,0.8);
    border: 1px solid rgba(160,200,160,0.4); border-radius: 3px; margin-top: 8px; cursor: pointer; }
  /* the debrief's timeline along the foot (timeline.js); in the debrief the HUD moves up over it */
  #timeline { position: fixed; left: 12px; bottom: 12px; width: calc(100% - 24px); height: 54px; cursor: pointer;
    touch-action: none; }
  body.debrief #hud { bottom: 76px; }
  body.debrief #debrief { max-height: calc(100% - 250px); }
  #events div { cursor: pointer; }
  #events div:hover { background: rgba(160,200,160,0.12); }
  #events div.at { background: rgba(79,216,255,0.2); color: #cfefff; }
  #notice { position: fixed; left: 50%; top: 6px; transform: translateX(-50%); font-size: 11px;
    color: var(--dim); white-space: nowrap; pointer-events: none; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="overlay"></canvas>
<div id="hud"></div>
<canvas id="timeline" hidden></canvas>
<div id="status">loading the flight core…</div>
<div id="notice">Unofficial. Not affiliated with Airbus, FlyByWire Simulations or Aerowinx. Not for type training.</div>
<div id="debrief" hidden><div id="verdict"></div><div id="events"></div><button id="save" type="button">save the recording (Ctrl+S)</button> <button id="open-button" type="button">open a recording (Ctrl+O)</button></div>
<input type="file" id="open" accept=".csv,text/csv,text/plain" hidden>
<script src="core.js"></script>
<script src="flight.js"></script>
</body>
</html>
